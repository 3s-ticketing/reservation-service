spring:
  application:
    name: reservation-service

  config:
    import: optional:configserver:http://localhost:10002

services:
  seat:
    url: ${SEAT_SERVICE_URL:http://seat-service:20004}
  match:
    url: ${MATCH_SERVICE_URL:http://match-service:20002}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://payment-service:20006}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18080/realms/ticketing

spring:
  cloud:
    openfeign:
      client:
        config:
          seat-service:
            connectTimeout: 1000   # 1초
            readTimeout: 2000      # 2초
          match-service:
            connectTimeout: 1000
            readTimeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      seatService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50          # 10건 중 5건 실패 시 OPEN
        waitDurationInOpenState: 30s      # 30초 후 HALF-OPEN 전환
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s     # 2초 초과 = slow call
        slowCallRateThreshold: 80         # slow call 80% 이상이면 OPEN
      matchService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 80

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    circuitbreakers:
      enabled: true